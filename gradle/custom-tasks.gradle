/**
 * Creates a mock google-services.json if GOOGLE_SERVICES_JSON environment variable is absent.
 * The file is written to the module root so that every variant (debug, release, ...) can find it.
 */
def targetGoogleServicesFile = file("google-services.json")
def legacyDebugGoogleServicesFile = file("src/debug/google-services.json")
def googleServicesPackageName = android.defaultConfig.applicationId

def writeGoogleServicesJson = {
    def secrets = System.getenv("GOOGLE_SERVICES_JSON")
    if (secrets != null && !secrets.trim().isEmpty()) {
        targetGoogleServicesFile.text = secrets
        return
    }
    if (legacyDebugGoogleServicesFile.exists() && legacyDebugGoogleServicesFile.length() == 0) {
        legacyDebugGoogleServicesFile.delete()
    }
    if (targetGoogleServicesFile.exists() && targetGoogleServicesFile.length() > 0) {
        return
    }
    targetGoogleServicesFile.text = """{
  "project_info": {
    "project_number": "123456789000",
    "firebase_url": "https://mock-project-default-rtdb.firebaseio.com",
    "project_id": "mock-project",
    "storage_bucket": "mock-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789000:android:mockappid123456",
        "android_client_info": {
          "package_name": "${googleServicesPackageName}"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "mock_AIzaSyBQJCUXVKUjD38-u5pWkqMtesIfFvxAcvs"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}"""
}

writeGoogleServicesJson()

tasks.register('createMockGoogleServices') {
    outputs.upToDateWhen { false }
    doLast {
        writeGoogleServicesJson()
    }
}

preBuild.dependsOn createMockGoogleServices

tasks.matching { it.name ==~ /process.*GoogleServices/ }.configureEach {
    dependsOn createMockGoogleServices
}
